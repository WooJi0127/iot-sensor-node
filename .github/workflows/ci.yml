name: Verify simulator, dashboard and host firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python, native dashboard and required Linux C host regression
        env:
          REQUIRE_FIRMWARE_TESTS: '1'
        run: python -m unittest discover -s tests -v

